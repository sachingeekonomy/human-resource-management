{% extends 'base_manager.html' %}

{% block content %}
<div class="p-6">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">Add Announcement</h2>
    <div class="bg-white p-6 rounded-lg shadow-sm">
        <form method="post">
            {% csrf_token %}
            <div class="mb-6">
                <label for="id_title" class="block mb-2 text-sm font-medium text-gray-900">Title</label>
                {{ form.title }}
            </div>
            <div class="mb-6">
                <label for="id_content" class="block mb-2 text-sm font-medium text-gray-900">Content</label>
                {{ form.content }}
            </div>
            <div class="flex space-x-4">
                <a href="{% url 'manager_view_announcements' %}" class="px-6 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent">
                    Cancel
                </a>
                <button type="submit" class="text-white bg-orange-500 hover:bg-orange-600 focus:ring-4 focus:outline-none focus:ring-orange-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center">Add Announcement</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
