services:
  ems-app:
    build: .
    container_name: employee-management-system
    ports:
      - "8001:8000"
    restart: unless-stopped
    environment:
      - PORT=8000
      - DEBUG=False
      - DATABASE_URL=postgres://postgres:postgres@ems-db:5432/ems_db
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,*
    volumes:
      - ems-media:/app/media
      - ems-static:/app/staticfiles
    depends_on:
      ems-db:
        condition: service_healthy
    networks:
      - ems-network

  ems-db:
    image: postgres:16
    container_name: ems-database
    environment:
      POSTGRES_DB: ems_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    restart: unless-stopped
    volumes:
      - ems-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ems-network

volumes:
  ems-data:
    driver: local
  ems-media:
    driver: local
  ems-static:
    driver: local

networks:
  ems-network:
    driver: bridge